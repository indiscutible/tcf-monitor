name: TCF slot check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test push"
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .state
          key: tcf-${{ github.run_id }}
          restore-keys: tcf-
      - name: Check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test }}
        run: |
          python3 - <<'PY'
          import os, re, json, html, urllib.request
          from urllib.parse import urljoin, urlparse
          from pathlib import Path
          MAIN = "https://www.afcalgary.ca/exams/tcf/registration-process/"
          FALLBACK = "https://www.afcalgary.ca/exams/tcf/tcf-registrations-open-1607/"
          TOPIC = os.environ["NTFY_TOPIC"]

          def push(msg, prio="urgent"):
              urllib.request.urlopen(urllib.request.Request(
                  "https://ntfy.sh/" + TOPIC, data=msg.encode(), method="POST",
                  headers={"Title": "TCF Calgary slot alert", "Priority": prio,
                           "Tags": "rotating_light", "Click": MAIN}), timeout=30)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (personal availability checker)"})
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")

          def clean(raw):
              t = re.sub(r"<(script|style)[\s\S]*?</\1>", " ", raw, flags=re.I)
              t = re.sub(r"<[^>]+>", " ", t)
              return re.sub(r"\s+", " ", html.unescape(t))

          def months(raw):
              t = clean(raw)
              ms = list(re.finditer(r"([A-Za-z]+ 20\d\d) sessions", t, re.I))
              out = {}
              for i, m in enumerate(ms):
                  end = ms[i + 1].start() if i + 1 < len(ms) else len(t)
                  seg = re.split(r"IMPORTANT|Step 3", t[m.end():end])[0]
                  out[m.group(1).title()] = "sold out" not in seg.lower()
              return out

          def dates(raw):
              t = clean(raw)
              pat = r"((?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)\s+\d{1,2}\s+[a-z]+)"
              ms = list(re.finditer(pat, t, re.I))
              out = {}
              for i, m in enumerate(ms):
                  end = ms[i + 1].start() if i + 1 < len(ms) else len(t)
                  seg = t[m.end():end]
                  out[re.sub(r"\s+", " ", m.group(1)).title()] = "sold out" not in seg.lower()
              return out

          if os.environ.get("TEST") == "true":
              push("Test alert: your TCF monitor works.")
              raise SystemExit
          raw = get(MAIN)
          mon = months(raw)
          if not mon:
              raise SystemExit("No session blocks found - page layout may have changed")
          urls = {FALLBACK}
          for h in re.findall(r'href=["\']([^"\']+)["\']', raw):
              u = urljoin(MAIN, h).split("#")[0]
              p = urlparse(u).path.strip("/")
              if p.startswith("exams/tcf/") and p != "exams/tcf/registration-process":
                  urls.add(u)
          dts = {}
          for u in sorted(urls)[:6]:
              try:
                  dts.update(dates(get(u)))
              except Exception as e:
                  print("skip", u, e)
          print("months:", mon); print("dates:", dts)
          sf = Path(".state/s2.json"); sf.parent.mkdir(exist_ok=True)
          prev = json.loads(sf.read_text()) if sf.exists() else None
          pd = (prev or {}).get("dates", {})
          opened = [k for k, v in dts.items() if v and not pd.get(k)]
          newm = [k for k in mon if prev is not None and k not in prev.get("months", {})]
          if opened:
              push("SEAT OPEN: " + ", ".join(opened) + ". Book now!")
          elif newm:
              push("New month listed: " + ", ".join(newm) + " (dates may be sold out)", "default")
          sf.write_text(json.dumps({"months": mon, "dates": dts}))
          PY
